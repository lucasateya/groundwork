<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groundwork — practice the conversation before it counts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321;
    --paper:#EDEFEA;
    --paper-raised:#F7F8F5;
    --gold:#C9A227;
    --gold-deep:#8f7015;
    --teal:#2B4C4A;
    --teal-pale:#E2EBE9;
    --muted:#5B6560;
    --red:#B23A48;
    --red-pale:#F6E4E6;
    --border:rgba(28,35,33,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .app{max-width:1080px;margin:0 auto;padding:2.5rem 1.5rem 3rem;display:flex;flex-direction:column;min-height:100vh;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.5rem;}
  .wordmark{font-family:'Fraunces',serif;font-weight:600;font-size:28px;letter-spacing:-0.01em;}
  .wordmark span{color:var(--gold-deep);}
  .tagline{font-size:14px;color:var(--muted);max-width:300px;text-align:right;line-height:1.5;}
  @media (max-width:760px){.tagline{text-align:left;max-width:none;}}
  .mode-tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;}
  .mode-tab{
    background:transparent;border:1px solid var(--border);border-radius:20px;
    padding:0.5rem 1rem;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;
    color:var(--muted);cursor:pointer;
  }
  .mode-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .mode-tab:not(.active):hover{background:rgba(28,35,33,0.06);}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;flex:1;align-items:start;}
  @media (max-width:760px){.layout{grid-template-columns:1fr;}}
  .rail{display:flex;flex-direction:column;gap:1.25rem;position:sticky;top:1.5rem;}
  .card{background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.15rem;}
  .card h3{font-size:12px;color:var(--muted);margin:0 0 0.5rem;font-weight:500;letter-spacing:0.01em;}
  .scenario-topic{font-size:11px;color:var(--gold-deep);font-weight:600;margin:0 0 0.15rem;}
  .scenario-title{font-family:'Fraunces',serif;font-size:17px;font-weight:500;margin:0 0 0.4rem;line-height:1.3;}
  .scenario-body{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 0.75rem;}
  .persona-tag{display:inline-block;font-size:11.5px;color:var(--teal);background:var(--teal-pale);padding:0.2rem 0.55rem;border-radius:20px;margin-bottom:0.7rem;}
  .shuffle-btn{width:100%;background:transparent;border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.6rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;}
  .shuffle-btn:hover:not(:disabled){background:rgba(28,35,33,0.06);}
  .shuffle-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .toggle-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .toggle-btn{flex:1;background:transparent;border:none;padding:0.55rem 0.4rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .15s ease, color .15s ease;}
  .toggle-btn.active{background:var(--ink);color:var(--paper);}
  .toggle-btn:not(.active):hover{background:rgba(28,35,33,0.06);}
  .toggle-btn:disabled{cursor:not-allowed;opacity:0.6;}
  .diff-note{font-size:12px;color:var(--muted);margin-top:0.55rem;line-height:1.5;}
  .reset-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.7rem;font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;}
  .reset-btn:hover{background:rgba(28,35,33,0.06);}
  .history-item{display:flex;justify-content:space-between;align-items:baseline;padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .h-topic{color:var(--ink);}
  .history-item .h-meta{color:var(--muted);font-size:11px;}
  .history-grade{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--gold-deep);}
  .history-empty{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .main{background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:560px;overflow:hidden;}
  .chat-scroll{flex:1;overflow-y:auto;padding:1.5rem 1.5rem 0.5rem;display:flex;flex-direction:column;gap:0.9rem;max-height:560px;}
  .msg{max-width:72%;padding:0.65rem 0.9rem;border-radius:12px;font-size:14.5px;line-height:1.55;}
  .msg.employer{align-self:flex-start;background:var(--teal-pale);color:var(--ink);border-bottom-left-radius:3px;}
  .msg.user{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:3px;}
  .msg .role-label{display:block;font-size:11px;font-weight:500;margin-bottom:3px;opacity:0.65;}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:0.65rem 0.9rem;background:var(--teal-pale);border-radius:12px;border-bottom-left-radius:3px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--teal);opacity:0.5;animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.3;}40%{opacity:0.9;}}
  .composer{border-top:1px solid var(--border);padding:0.9rem 1.1rem 0.4rem;display:flex;gap:0.6rem;align-items:flex-end;}
  textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;max-height:110px;background:var(--paper);color:var(--ink);}
  textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button.send{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0.6rem 1rem;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;}
  button.send:hover{background:#33403d;}
  button.send:disabled{opacity:0.45;cursor:not-allowed;}
  .word-counter{font-size:11.5px;color:var(--muted);padding:0.2rem 1.1rem 0.3rem;text-align:right;}
  .word-counter.warn{color:var(--red);}
  .footer-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 1.1rem 0.9rem;font-size:12.5px;color:var(--muted);}
  .end-btn{background:transparent;border:1px solid var(--gold-deep);color:var(--gold-deep);border-radius:8px;padding:0.45rem 0.8rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;}
  .end-btn:hover{background:rgba(201,162,39,0.1);}
  .end-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .feedback-view{padding:1.75rem 1.75rem 1.5rem;display:flex;flex-direction:column;gap:1.1rem;flex:1;overflow-y:auto;}
  .grade-header{display:flex;align-items:center;gap:1rem;}
  .grade-circle{width:56px;height:56px;border-radius:50%;background:var(--teal-pale);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--teal);flex-shrink:0;}
  .feedback-view h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0 0 0.2rem;}
  .feedback-view .sub{font-size:13px;color:var(--muted);margin:0;}
  .rubric{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .rubric-item{background:var(--paper);border-radius:8px;padding:0.6rem 0.75rem;}
  .rubric-item .r-label{font-size:11.5px;color:var(--muted);margin-bottom:0.3rem;}
  .rubric-meter{display:flex;gap:3px;}
  .rubric-meter span{flex:1;height:6px;border-radius:3px;background:var(--border);}
  .rubric-meter span.filled{background:var(--gold-deep);}
  .fb-block{border-left:3px solid var(--teal);padding:0.15rem 0 0.15rem 0.9rem;}
  .fb-block.warn{border-left-color:var(--red);}
  .fb-block.gold{border-left-color:var(--gold-deep);}
  .fb-block h4{font-size:12.5px;font-weight:600;margin:0 0 0.3rem;color:var(--ink);}
  .fb-block p{font-size:14px;line-height:1.6;margin:0;color:#3a423f;}
  .phrase-pair{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.3rem;}
  .phrase{font-size:13.5px;padding:0.55rem 0.7rem;border-radius:8px;line-height:1.5;}
  .phrase.before{background:var(--red-pale);color:#5c1d26;}
  .phrase.after{background:var(--teal-pale);color:#173330;}
  .phrase b{font-weight:600;font-size:11px;display:block;margin-bottom:2px;opacity:0.75;}
  .again-btn{align-self:flex-start;margin-top:0.5rem;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0.6rem 1.1rem;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;}
  .again-btn:hover{background:#33403d;}
  .error-note{font-size:12.5px;color:var(--red);padding:0 1.1rem 0.6rem;}
  .save-note{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">Ground<span>work</span></div>
    <div class="tagline" id="tagline">Practice the conversation before it counts. Every session is scored so you can see yourself improve.</div>
  </header>

  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab active" data-mode="negotiation">Negotiation practice</button>
    <button class="mode-tab" data-mode="interview">Interview practice</button>
  </div>

  <div class="layout">
    <div class="rail">
      <div class="card" id="situation-card">
        <h3>Situation</h3>
        <p class="scenario-topic" id="scenario-topic"></p>
        <p class="scenario-title" id="scenario-title"></p>
        <p class="scenario-body" id="scenario-body"></p>
        <span class="persona-tag" id="persona-tag"></span>
        <button class="shuffle-btn" id="shuffle-btn">Shuffle situation</button>
      </div>

      <div class="card">
        <h3>Difficulty</h3>
        <div class="toggle-group" id="difficulty-toggle">
          <button class="toggle-btn active" id="diff-btn-0" data-idx="0"></button>
          <button class="toggle-btn" id="diff-btn-1" data-idx="1"></button>
        </div>
        <p class="diff-note" id="diff-note"></p>
      </div>

      <div class="card">
        <h3>Your history</h3>
        <div id="history-list">
          <p class="history-empty">Finish a session to see your grades here.</p>
        </div>
        <p style="font-size:11px;color:var(--muted);margin:0.6rem 0 0;line-height:1.5;">We save your grade, not your conversation.</p>
      </div>

      <button class="reset-btn" id="reset-btn">Restart this situation</button>
    </div>

    <div class="main" id="main-panel">
      <div class="chat-scroll" id="chat-scroll">
        <div class="msg employer">
          <span class="role-label" id="opening-label"></span>
          <span id="opening-text"></span>
        </div>
      </div>
      <div class="error-note" id="error-note" style="display:none;"></div>
      <div class="composer">
        <textarea id="user-input" rows="1" placeholder="Type your response..."></textarea>
        <button class="send" id="send-btn">Send</button>
      </div>
      <div class="word-counter" id="word-counter" style="display:none;"></div>
      <div class="footer-row">
        <span id="footer-hint">4 exchanges is usually enough to get useful feedback.</span>
        <button class="end-btn" id="end-btn">End & get graded</button>
      </div>
    </div>
  </div>
</div>

<script>
const NEGOTIATION_SCENARIOS = [
  { id:'salary', topic:'Salary offer', title:'The salary offer', roleLabel:'Hiring Manager', name:'Dana',
    body:"You've been offered a Warehouse Operations Coordinator role. {name}, the hiring manager, just named a number.",
    opening:"We'd love to have you on the team. We're offering $48,000 a year for the role, health coverage starts after 90 days. What do you think?",
    issue:"the starting salary and benefits for a new job offer" },
  { id:'raise', topic:'Asking for a raise', title:'The raise conversation', roleLabel:'Your manager', name:'Priya',
    body:"You've been in your role 18 months and requested this meeting to ask {name} for a raise.",
    opening:"You wanted to talk about your compensation — go ahead, I'm listening.",
    issue:"asking an existing manager for a raise, initiated by the candidate" },
  { id:'rent', topic:'Rent renewal', title:'The rent increase', roleLabel:'Landlord', name:'Marcus',
    body:"Your lease is up and {name}, your landlord, wants to raise the rent by $200 a month.",
    opening:"Your lease is up next month. Given the market, we're renewing at $1,850, up from $1,650. Let me know if that works.",
    issue:"a rent increase on lease renewal" },
  { id:'freelance', topic:'Freelance rate', title:'The freelance budget', roleLabel:'Client', name:'Alex',
    body:"{name} wants to hire you for a 3-month design project and just named their budget.",
    opening:"We loved your portfolio. Our budget for this project is $3,000 total, covering the full three months. Can you work with that?",
    issue:"a freelance project rate" },
  { id:'purchase', topic:'Faulty purchase', title:'The damaged couch', roleLabel:'Store manager', name:'Jordan',
    body:"A couch you bought arrived damaged, but it's just past the store's official return window. {name} is the store manager.",
    opening:"I see the return window closed two weeks ago, so technically we're not obligated to do anything here. What did you have in mind?",
    issue:"a return or refund request outside the official policy window" },
  { id:'roommate', topic:'Roommate bills', title:'The bill split', roleLabel:'Roommate', name:'Sam',
    body:"You've been covering more than your share of shared bills and want to renegotiate the split with {name}, your roommate.",
    opening:"I mean, we agreed to split everything 50/50 when we moved in, that hasn't changed for me. What's up?",
    issue:"renegotiating a shared living cost split with a roommate" }
];

const NEGOTIATION_PERSONAS = [
  { id:'pragmatist', label:'tends to be reasonable if you make a clear case',
    behavior:"You're reasonable and practical: if the other person makes a clear, specific case, you factor it in seriously and say so out loud." },
  { id:'hardBargainer', label:'tends to hold their ground',
    behavior:"You're firm and even-keeled: you repeat your position calmly, cite real constraints (budget, policy, comparables), and rarely soften unless given a genuinely compelling reason." },
  { id:'avoider', label:'tends to be vague and hard to pin down',
    behavior:"You're a bit non-committal: you deflect direct questions, change the subject slightly, or say you'll 'look into it' — the other person has to press you before you give a real answer." },
  { id:'warmTester', label:'is friendly but is quietly testing you',
    behavior:"You're warm and easygoing on the surface, but you're quietly testing whether the other person will settle for less than they should — if they push back clearly, acknowledge it warmly and move; if they don't, let the conversation end without volunteering more." }
];

const INTERVIEW_SCENARIOS = [
  { id:'marketing', topic:'Marketing Coordinator interview', title:'Marketing Coordinator', org:'Northlight Media', roleLabel:'Interviewer',
    body:"You're interviewing for a Marketing Coordinator role focused on social content and campaign support at {org}.",
    opening:"Thanks for coming in today — I'm {name}, and I'll be interviewing you for the {title} role. Let's start simple: tell me a little about yourself and why this role caught your eye.",
    issue:"a job interview for a Marketing Coordinator role" },
  { id:'support', topic:'Customer Support interview', title:'Customer Support Specialist', org:'Brightpath Software', roleLabel:'Interviewer',
    body:"You're interviewing for a Customer Support Specialist role handling inbound tickets and chat at {org}.",
    opening:"Thanks for coming in today — I'm {name}, and I'll be interviewing you for the {title} role. Let's start simple: tell me a little about yourself and why this role caught your eye.",
    issue:"a job interview for a Customer Support Specialist role" },
  { id:'analyst', topic:'Data Analyst interview', title:'Junior Data Analyst', org:'Veridian Health', roleLabel:'Interviewer',
    body:"You're interviewing for a Junior Data Analyst role working with spreadsheets and dashboards at {org}.",
    opening:"Thanks for coming in today — I'm {name}, and I'll be interviewing you for the {title} role. Let's start simple: tell me a little about yourself and why this role caught your eye.",
    issue:"a job interview for a Junior Data Analyst role" },
  { id:'retail', topic:'Assistant Manager interview', title:'Assistant Store Manager', org:'Cedar & Co.', roleLabel:'Interviewer',
    body:"You're interviewing for an Assistant Store Manager role overseeing a small retail team at {org}.",
    opening:"Thanks for coming in today — I'm {name}, and I'll be interviewing you for the {title} role. Let's start simple: tell me a little about yourself and why this role caught your eye.",
    issue:"a job interview for an Assistant Store Manager role" }
];

const INTERVIEW_PERSONAS = [
  { id:'warm', name:'Riley', label:'is warm and puts you at ease',
    behavior:"You're friendly and encouraging: you react positively, and ask gentle follow-up questions that build on what the candidate says." },
  { id:'formal', name:'Morgan', label:'is formal and strictly professional',
    behavior:"You're formal and businesslike: minimal small talk, you move through questions efficiently, and you expect clear, well-organized answers." },
  { id:'rapidFire', name:'Devon', label:'moves quickly through questions',
    behavior:"You keep the pace brisk: you ask a question, listen briefly, and move to the next one — if the candidate rambles, gently note you'd love a more concise answer before moving on." },
  { id:'skeptical', name:'Taylor', label:'probes for specifics',
    behavior:"You're a probing interviewer: when an answer is vague, you follow up with something like 'can you give me a specific example?' or 'why is that?' before moving on." }
];

const MODES = {
  negotiation: {
    label:'Negotiation practice',
    tagline:"Practice the conversation before it counts. Every session is scored so you can see yourself improve.",
    footerHint:"4 exchanges is usually enough to get useful feedback.",
    endLabel:"End & get graded",
    scenarios: NEGOTIATION_SCENARIOS,
    personas: NEGOTIATION_PERSONAS,
    wordCounter:false,
    difficulties:[
      { key:'gentle', label:'Gentle', note:'Concedes fairly easily — good for a first try.',
        promptFragment:"Overall, concede at least partially within one or two replies if the other person pushes back at all reasonably. Occasionally, at the end of a reply, add one short bracketed coaching aside like [tip: naming a specific number is stronger than saying 'more'] pointing out something they did well or could try." },
      { key:'realistic', label:'Realistic pushback', note:'Holds position for a few exchanges before moving — closer to a real negotiation.',
        promptFragment:"Overall, hold your position for at least two or three exchanges unless given a genuinely compelling reason to move. Do not add coaching asides or break character under any circumstances." }
    ],
    rubric:[
      { key:'anchoring', label:'Anchoring & opening ask', desc:'how clearly they opened with a specific ask or number' },
      { key:'assertiveness', label:'Assertiveness', desc:'whether they held their ground rather than caving immediately' },
      { key:'adapting', label:'Listening & adapting', desc:'whether they responded to what the counterpart actually said' },
      { key:'outcome', label:'Outcome', desc:'how much ground they actually gained by the end' }
    ]
  },
  interview: {
    label:'Interview practice',
    tagline:"Practice your first impression and concise answers before the real interview.",
    footerHint:"Aim for 3-5 questions, then end for feedback.",
    endLabel:"End & get graded",
    scenarios: INTERVIEW_SCENARIOS,
    personas: INTERVIEW_PERSONAS,
    wordCounter:true,
    difficulties:[
      { key:'warmup', label:'Warm-up', note:'Encouraging, gives you room to find your footing.',
        promptFragment:"Overall, be encouraging and forgiving of a rough start; if an answer is unclear, ask a gentle clarifying follow-up. Occasionally, at the end of a reply, add one short bracketed coaching aside like [tip: try answering in under 45 seconds] pointing out something they did well or could tighten." },
      { key:'formal', label:'Formal panel', note:'No coaching — judged the way a real panel would.',
        promptFragment:"Overall, conduct this like a real formal interview: don't coach or soften, and if an answer rambles or avoids the question, move on without commentary the way a real panel would." }
    ],
    rubric:[
      { key:'firstImpression', label:'First impression', desc:"how strong and confident their opening answer and overall presence was" },
      { key:'conciseness', label:'Conciseness', desc:"whether their answers were appropriately brief and focused rather than rambling" },
      { key:'structure', label:'Structure & specifics', desc:"whether answers included concrete, specific examples rather than vague generalities" },
      { key:'relevance', label:'Relevance', desc:"whether answers actually addressed the question that was asked" }
    ]
  }
};

// window.storage only exists inside Claude artifacts. This shim gives the
// same get/set/list interface backed by the browser's localStorage instead,
// so grade history and flag logs work once this is deployed on its own.
// It's per-device, not per-account — swap in a real database (e.g. Supabase)
// when you want history to follow a signed-in user across devices.
const storage = {
  async set(key, value){ localStorage.setItem(key, value); return { key, value }; },
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return { key, value: v };
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
    return { keys };
  }
};

const MAX_USER_MESSAGES = 10;

let currentModeKey = 'negotiation';
let currentScenario = NEGOTIATION_SCENARIOS[0];
let currentPersona = NEGOTIATION_PERSONAS[1];
let difficultyIdx = 0;
let messages = [];
let busy = false;
let ended = false;

function el(id){ return document.getElementById(id); }
function userTurnCount(){ return messages.filter(m => m.role === 'user').length; }
function updateFooterHint(){
  const hint = el('footer-hint');
  if(!hint) return;
  const remaining = MAX_USER_MESSAGES - userTurnCount();
  if(userTurnCount() === 0){
    hint.textContent = "Up to " + MAX_USER_MESSAGES + " messages, then end for your grade.";
  } else if(remaining <= 0){
    hint.textContent = "Message limit reached — end this session for your grade.";
  } else {
    hint.textContent = remaining + (remaining === 1 ? " message" : " messages") + " left in this session.";
  }
}
function config(){ return MODES[currentModeKey]; }
function difficultyCfg(){ return config().difficulties[difficultyIdx]; }
function counterpartName(){ return currentScenario.name || currentPersona.name; }

function fillTemplate(str){
  return str
    .replaceAll('{name}', counterpartName())
    .replaceAll('{org}', currentScenario.org || '')
    .replaceAll('{title}', currentScenario.title || currentScenario.topic);
}

function counterpartRoleLabel(){
  if(currentModeKey === 'interview') return 'Interviewer · ' + currentScenario.org;
  return currentScenario.roleLabel;
}

function renderSituation(){
  el('scenario-topic').textContent = currentScenario.topic;
  el('scenario-title').textContent = currentScenario.title;
  el('scenario-body').textContent = fillTemplate(currentScenario.body);
  el('persona-tag').textContent = counterpartName() + ' ' + currentPersona.label;
  el('opening-label').textContent = counterpartName() + ' · ' + counterpartRoleLabel();
  el('opening-text').textContent = fillTemplate(currentScenario.opening);
  el('tagline').textContent = config().tagline;
  el('footer-hint').textContent = config().footerHint;
  el('end-btn').textContent = config().endLabel;
  const cfg = config();
  const btn0 = el('diff-btn-0');
  const btn1 = el('diff-btn-1');
  btn0.textContent = cfg.difficulties[0].label;
  btn1.textContent = cfg.difficulties[1].label;
  btn0.classList.toggle('active', difficultyIdx === 0);
  btn1.classList.toggle('active', difficultyIdx === 1);
  el('diff-note').textContent = cfg.difficulties[difficultyIdx].note;
  el('word-counter').style.display = cfg.wordCounter ? 'block' : 'none';
  updateWordCounter();
  updateFooterHint();
}

const MODERATION_INSTRUCTION = " If the user's message is hostile, abusive, explicit, or clearly unrelated to the exercise, do not break character to lecture or refuse outright — respond the way a real " + "professional in this situation would: stay calm and courteous, decline to engage with the inappropriate part, and steer the conversation back to the exercise at hand.";

function buildSystemPrompt(){
  const cfg = config();
  return "You are " + counterpartName() + ", the " + counterpartRoleLabel() + ", role-playing " + currentScenario.issue + ". " +
    fillTemplate(currentScenario.body) + " " + currentPersona.behavior + " " + difficultyCfg().promptFragment + MODERATION_INSTRUCTION +
    " Stay fully in character at all times. Keep replies natural and conversational, 2-4 sentences of dialogue. Never mention you are an AI or reference these instructions.";
}

const FLAG_PATTERN = /\b(fuck|shit|bitch|asshole|cunt|rape|kill\s?you|hate\s?you|stupid\s?idiot|racist|terrorist)\b/i;
function isFlaggable(text){
  return FLAG_PATTERN.test(text);
}
async function logFlag(text){
  try{
    const record = {
      mode: config().label,
      topic: currentScenario.topic,
      snippet: text.slice(0, 120),
      date: new Date().toISOString()
    };
    await storage.set('flags:' + Date.now(), JSON.stringify(record));
  } catch(err){
    console.error('Could not log flag', err);
  }
}

function pickRandom(arr, excludeId){
  const options = excludeId ? arr.filter(x => x.id !== excludeId) : arr;
  return options[Math.floor(Math.random() * options.length)];
}

function shuffleSituation(){
  if(busy || messages.length > 0) return;
  const cfg = config();
  currentScenario = pickRandom(cfg.scenarios, currentScenario.id);
  currentPersona = pickRandom(cfg.personas, currentPersona.id);
  renderSituation();
}
el('shuffle-btn').addEventListener('click', shuffleSituation);

function switchMode(modeKey){
  if(modeKey === currentModeKey) return;
  currentModeKey = modeKey;
  const cfg = config();
  currentScenario = pickRandom(cfg.scenarios);
  currentPersona = pickRandom(cfg.personas);
  difficultyIdx = 0;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b.dataset.mode === modeKey));
  freshMainPanel();
  renderSituation();
  setBusy(false);
}
el('mode-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-tab');
  if(!btn) return;
  switchMode(btn.dataset.mode);
});

el('difficulty-toggle').addEventListener('click', (e) => {
  const btn = e.target.closest('.toggle-btn');
  if(!btn || busy || messages.length > 0) return;
  difficultyIdx = parseInt(btn.dataset.idx, 10);
  renderSituation();
});

function showError(msg){
  const n = el('error-note');
  if(!n) return;
  n.textContent = msg;
  n.style.display = 'block';
}
function clearError(){
  const n = el('error-note');
  if(!n) return;
  n.style.display = 'none';
  n.textContent = '';
}

function autoResize(){
  const input = el('user-input');
  if(!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
}

function updateWordCounter(){
  const counter = el('word-counter');
  const input = el('user-input');
  if(!counter || !input || !config().wordCounter){ if(counter) counter.style.display = 'none'; return; }
  counter.style.display = 'block';
  const words = input.value.trim().length ? input.value.trim().split(/\s+/).length : 0;
  counter.textContent = words + (words === 1 ? ' word' : ' words');
  counter.classList.toggle('warn', words > 90);
  if(words > 90) counter.textContent += ' — that is long for an interview answer';
}

function addMessage(role, text){
  const chatScroll = el('chat-scroll');
  if(!chatScroll) return;
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'assistant' ? 'employer' : 'user');
  const label = document.createElement('span');
  label.className = 'role-label';
  label.textContent = role === 'assistant' ? counterpartName() : 'You';
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  chatScroll.appendChild(div);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function showTyping(){
  const chatScroll = el('chat-scroll');
  if(!chatScroll) return;
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatScroll.appendChild(div);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function hideTyping(){
  const t = el('typing-indicator');
  if(t) t.remove();
}

function setBusy(state){
  busy = state;
  const send = el('send-btn');
  const input = el('user-input');
  const end = el('end-btn');
  const shuffle = el('shuffle-btn');
  const capped = userTurnCount() >= MAX_USER_MESSAGES;
  if(send) send.disabled = state || ended || capped;
  if(input) input.disabled = state || ended || capped;
  if(end) end.disabled = state || ended || messages.length === 0;
  if(shuffle) shuffle.disabled = state || ended || messages.length > 0;
}

async function callClaude(systemPrompt, apiMessages){
  const response = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: systemPrompt, messages: apiMessages })
  });
  if(!response.ok) throw new Error("Request failed with status " + response.status);
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || "").join("").trim();
  if(!text) throw new Error("Empty response");
  return text;
}

async function sendMessage(){
  const input = el('user-input');
  if(!input) return;
  const text = input.value.trim();
  if(!text || busy || ended || userTurnCount() >= MAX_USER_MESSAGES) return;
  clearError();
  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  if(isFlaggable(text)) logFlag(text);
  input.value = '';
  autoResize();
  updateWordCounter();
  updateFooterHint();
  setBusy(true);
  showTyping();
  try{
    const reply = await callClaude(buildSystemPrompt(), messages);
    hideTyping();
    addMessage('assistant', reply);
    messages.push({ role: 'assistant', content: reply });
  } catch(err){
    hideTyping();
    showError("The reply didn't come through. Check your connection and try sending again.");
  } finally {
    setBusy(false);
  }
}

const mainPanel = el('main-panel');
mainPanel.addEventListener('click', (e) => {
  if(e.target.id === 'send-btn') sendMessage();
  if(e.target.id === 'end-btn') endNegotiation();
  if(e.target.id === 'again-btn') startNewSituation();
});
mainPanel.addEventListener('keydown', (e) => {
  if(e.target.id === 'user-input' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
mainPanel.addEventListener('input', (e) => {
  if(e.target.id === 'user-input'){ autoResize(); updateWordCounter(); }
});

function parseFeedbackJSON(raw){
  let cleaned = raw.trim();
  cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/,'').replace(/```\s*$/,'');
  return JSON.parse(cleaned);
}

function scoreToLetter(avg){
  if(avg >= 4.5) return 'A';
  if(avg >= 3.5) return 'B';
  if(avg >= 2.5) return 'C';
  if(avg >= 1.5) return 'D';
  return 'F';
}

function meterHTML(score){
  let out = '';
  for(let i=1;i<=5;i++) out += '<span class="' + (i <= score ? 'filled' : '') + '"></span>';
  return out;
}

async function saveAttempt(avg, grade){
  try{
    const record = {
      mode: config().label,
      topic: currentScenario.topic,
      persona: currentPersona.id,
      difficulty: difficultyCfg().label,
      grade: grade,
      avg: avg,
      date: new Date().toISOString()
    };
    const key = 'attempts:' + Date.now();
    await storage.set(key, JSON.stringify(record));
  } catch(err){
    console.error('Could not save attempt', err);
  }
}

async function loadHistory(){
  const listEl = el('history-list');
  if(!listEl) return;
  try{
    const result = await storage.list('attempts:');
    if(!result || !result.keys || result.keys.length === 0){
      listEl.innerHTML = '<p class="history-empty">Finish a session to see your grades here.</p>';
      return;
    }
    const keys = result.keys.slice().sort().reverse().slice(0, 6);
    const records = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) records.push(JSON.parse(r.value));
      } catch(e){}
    }
    if(records.length === 0){
      listEl.innerHTML = '<p class="history-empty">Finish a session to see your grades here.</p>';
      return;
    }
    listEl.innerHTML = records.map(r => {
      const d = new Date(r.date);
      const dateStr = (d.getMonth()+1) + '/' + d.getDate();
      return '<div class="history-item"><div><div class="h-topic">' + r.topic + '</div><div class="h-meta">' + r.mode + ' · ' + dateStr + '</div></div><div class="history-grade">' + r.grade + '</div></div>';
    }).join('');
  } catch(err){
    listEl.innerHTML = '<p class="history-empty">History isn\'t available right now.</p>';
  }
}

function renderFeedback(fb){
  const cfg = config();
  const keys = cfg.rubric.map(r => r.key);
  const total = keys.reduce((sum, k) => sum + (fb.scores[k] || 0), 0);
  const avg = total / keys.length;
  const grade = scoreToLetter(avg);
  mainPanel.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'feedback-view';
  const rubricHTML = cfg.rubric.map(r =>
    '<div class="rubric-item"><div class="r-label">' + r.label + '</div><div class="rubric-meter">' + meterHTML(fb.scores[r.key] || 0) + '</div></div>'
  ).join('');
  view.innerHTML = `
    <div class="grade-header">
      <div class="grade-circle">${grade}</div>
      <div>
        <h2>Session graded</h2>
        <p class="sub">${currentScenario.topic} · ${difficultyCfg().label}</p>
      </div>
    </div>
    <div class="rubric">${rubricHTML}</div>
    <div class="fb-block gold">
      <h4>What worked</h4>
      <p>${fb.whatWorked}</p>
    </div>
    <div class="fb-block warn">
      <h4>Try this differently next time</h4>
      <p>${fb.tryDifferently}</p>
    </div>
    <div class="fb-block">
      <h4>A stronger way to say it</h4>
      <div class="phrase-pair">
        <div class="phrase before"><b>What you said</b>${fb.strongerPhrase.original}</div>
        <div class="phrase after"><b>Try instead</b>${fb.strongerPhrase.improved}</div>
      </div>
    </div>
    <div class="fb-block gold">
      <h4>Overall</h4>
      <p>${fb.overall}</p>
    </div>
    <p class="save-note">Saved to your history.</p>
    <button class="again-btn" id="again-btn">Try a new situation</button>
  `;
  mainPanel.appendChild(view);
  saveAttempt(avg, grade).then(loadHistory);
}

async function endNegotiation(){
  if(busy || ended || messages.length === 0) return;
  ended = true;
  setBusy(true);
  clearError();
  const cfg = config();
  const transcriptText = messages.map(m => (m.role === 'user' ? 'You' : counterpartName()) + ': ' + m.content).join('\n');
  const rubricDesc = cfg.rubric.map(r => r.key + " = " + r.desc + ".").join(' ');
  const scoreKeys = cfg.rubric.map(r => '"' + r.key + '": number').join(', ');
  const feedbackSystem = "You are a coach reviewing a practice transcript of " + currentScenario.issue + ". Analyze only the user's turns, labeled 'You'. Return ONLY valid JSON, with no markdown formatting, no code fences, and no preamble, in exactly this shape: {\"scores\": {" + scoreKeys + "}, \"whatWorked\": string, \"tryDifferently\": string, \"strongerPhrase\": {\"original\": string, \"improved\": string}, \"overall\": string}. Each score is an integer from 1 to 5. " + rubricDesc + " Keep each text field to 1-3 concise, plain-spoken sentences, written directly to the user as \"you\". strongerPhrase.original must be an actual line the user wrote in the transcript.";
  try{
    const raw = await callClaude(feedbackSystem, [{ role: 'user', content: "Here is the transcript:\n\n" + transcriptText }]);
    const fb = parseFeedbackJSON(raw);
    renderFeedback(fb);
    messages = [];
  } catch(err){
    ended = false;
    showError("Couldn't generate a grade just now. Try ending the session again.");
    setBusy(false);
  }
}

function freshMainPanel(){
  messages = [];
  ended = false;
  clearError();
  mainPanel.innerHTML = `
    <div class="chat-scroll" id="chat-scroll">
      <div class="msg employer">
        <span class="role-label" id="opening-label"></span>
        <span id="opening-text"></span>
      </div>
    </div>
    <div class="error-note" id="error-note" style="display:none;"></div>
    <div class="composer">
      <textarea id="user-input" rows="1" placeholder="Type your response..."></textarea>
      <button class="send" id="send-btn">Send</button>
    </div>
    <div class="word-counter" id="word-counter" style="display:none;"></div>
    <div class="footer-row">
      <span id="footer-hint"></span>
      <button class="end-btn" id="end-btn"></button>
    </div>
  `;
}

function startNewSituation(){
  const cfg = config();
  currentScenario = pickRandom(cfg.scenarios, currentScenario.id);
  currentPersona = pickRandom(cfg.personas, currentPersona.id);
  freshMainPanel();
  renderSituation();
  setBusy(false);
}

el('reset-btn').addEventListener('click', () => {
  if(busy) return;
  freshMainPanel();
  renderSituation();
  setBusy(false);
});

async function renderAdminView(){
  const app = document.querySelector('.app');
  app.innerHTML = '<h2 style="font-family:\'Fraunces\',serif;font-weight:500;">Flagged messages</h2><p style="color:var(--muted);font-size:13px;">Snippets only — no names or full transcripts are stored.</p><div id="admin-list" style="margin-top:1rem;"></div>';
  const listEl = el('admin-list');
  try{
    const result = await storage.list('flags:');
    if(!result || !result.keys || result.keys.length === 0){
      listEl.innerHTML = '<p style="color:var(--muted);font-size:13px;">No flags yet.</p>';
      return;
    }
    const keys = result.keys.slice().sort().reverse();
    const records = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) records.push(JSON.parse(r.value));
      } catch(e){}
    }
    listEl.innerHTML = records.map(r => {
      const d = new Date(r.date);
      return '<div class="card" style="margin-bottom:0.6rem;"><div style="font-size:11px;color:var(--gold-deep);font-weight:600;">' + r.mode + ' · ' + r.topic + ' · ' + d.toLocaleString() + '</div><div style="font-size:13.5px;margin-top:0.3rem;">"' + r.snippet + '"</div></div>';
    }).join('');
  } catch(err){
    listEl.innerHTML = '<p style="color:var(--red);font-size:13px;">Could not load flags.</p>';
  }
}

if(new URLSearchParams(location.search).get('admin') === '1'){
  renderAdminView();
} else {
  renderSituation();
  setBusy(false);
  loadHistory();
}
</script>
</body>
</html>
