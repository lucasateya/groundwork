<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groundwork — practice the conversation before it counts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321;
    --paper:#EDEFEA;
    --paper-raised:#F7F8F5;
    --gold:#C9A227;
    --gold-deep:#8f7015;
    --gold-pale:#F3E8C9;
    --teal:#2B4C4A;
    --teal-pale:#E2EBE9;
    --muted:#5B6560;
    --red:#B23A48;
    --red-pale:#F6E4E6;
    --border:rgba(28,35,33,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .app{max-width:1400px;margin:0 auto;padding:2.5rem clamp(1.5rem, 4vw, 4rem) 3rem;display:flex;flex-direction:column;min-height:100vh;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.5rem;}
  .wordmark{font-family:'Fraunces',serif;font-weight:600;font-size:28px;letter-spacing:-0.01em;}
  .wordmark span{color:var(--gold-deep);}
  .tagline{font-size:14px;color:var(--muted);max-width:300px;text-align:right;line-height:1.5;}
  @media (max-width:760px){.tagline{text-align:left;max-width:none;}}
  .mode-tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;}
  .mode-tab{
    background:transparent;border:1px solid var(--border);border-radius:20px;
    padding:0.5rem 1rem;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;
    color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:0.4rem;
  }
  .mode-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .mode-tab:not(.active):not(:disabled):hover{background:rgba(28,35,33,0.06);}
  .mode-tab:disabled{opacity:0.55;cursor:not-allowed;}
  .section-switch{display:flex;gap:0.75rem;margin-bottom:1.75rem;flex-wrap:wrap;}
  .section-btn{
    flex:0 1 220px;background:var(--paper-raised);border:2px solid var(--border);border-radius:12px;
    padding:0.7rem 1rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:0.15rem;
  }
  .section-btn-label{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);}
  .section-btn-sub{font-size:11.5px;color:var(--muted);}
  .section-btn:not(.active):hover{background:rgba(28,35,33,0.05);}
  .section-btn.active[data-section="practice"]{border-color:var(--teal);background:var(--teal-pale);}
  .section-btn.active[data-section="learn"]{border-color:var(--gold-deep);background:var(--gold-pale);}
  .skill-row{display:flex;justify-content:space-between;align-items:center;padding:0.55rem 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;}
  .skill-row:last-child{border-bottom:none;}
  .skill-row.locked{opacity:0.4;cursor:not-allowed;}
  .skill-row.current{color:var(--gold-deep);font-weight:600;}
  .skill-stars{color:var(--gold-deep);font-size:12px;letter-spacing:1px;}
  .tier-tag{font-size:11px;color:var(--gold-deep);font-weight:600;margin:0 0 0.15rem;}
  .path-node{
    position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:20px;background:var(--paper-raised);
    border:3px solid var(--border);color:var(--muted);cursor:pointer;box-shadow:0 3px 6px rgba(28,35,33,0.12);
    transition:transform .12s ease;
  }
  .path-node:hover:not(.locked){transform:scale(1.06);}
  .path-node.locked{cursor:not-allowed;opacity:0.5;}
  .path-node.passed{background:var(--teal);border-color:var(--teal);color:#fff;}
  .path-node.current{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;animation:pathpulse 1.8s infinite;}
  @keyframes pathpulse{0%,100%{box-shadow:0 3px 6px rgba(28,35,33,0.12), 0 0 0 0 rgba(143,112,21,0.35);}50%{box-shadow:0 3px 6px rgba(28,35,33,0.12), 0 0 0 9px rgba(143,112,21,0);}}
  .path-bubble{
    position:absolute;background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;
    padding:0.3rem 0.65rem;border-radius:14px;white-space:nowrap;
  }
  .path-bubble:after{content:'';position:absolute;bottom:-5px;left:18px;border-width:5px 5px 0;border-style:solid;border-color:var(--ink) transparent transparent;}
  .path-stars{position:absolute;font-size:13px;color:var(--gold-deep);letter-spacing:2px;white-space:nowrap;}
  .path-title{position:absolute;font-size:11px;color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
  .path-tier-label{position:absolute;font-size:11px;font-weight:600;color:var(--gold-deep);white-space:nowrap;text-transform:uppercase;letter-spacing:0.04em;}
  .path-popover{position:absolute;background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;padding:0.8rem 0.9rem;box-shadow:0 8px 20px rgba(28,35,33,0.16);z-index:5;}
  .path-popover-title{font-family:'Fraunces',serif;font-weight:600;font-size:14px;margin:0 0 0.35rem;line-height:1.3;}
  .path-popover-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 0.55rem;}
  .path-popover-rating{font-size:12.5px;color:var(--gold-deep);letter-spacing:2px;margin:0 0 0.55rem;}
  .path-popover-locked{font-size:12px;color:var(--muted);font-style:italic;margin:0;}
  .path-popover-start{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:0.5rem 0.6rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;}
  .path-popover-start:hover{background:#33403d;}
  .track-tabs{display:flex;gap:0.6rem;margin-bottom:1.5rem;}
  .track-tab{
    background:var(--paper-raised);border:1px solid var(--border);border-radius:20px;
    padding:0.45rem 0.9rem;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
    color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:0.4rem;
  }
  .track-tab.active{background:var(--gold-pale);border-color:var(--gold-deep);color:var(--ink);font-weight:600;}
  .track-tab:not(.active):not(:disabled):hover{background:rgba(28,35,33,0.05);}
  .track-tab:disabled{opacity:0.55;cursor:not-allowed;}
  .soon-badge{font-size:10px;font-weight:600;color:var(--gold-deep);background:var(--gold-pale);border-radius:10px;padding:0.15rem 0.5rem;}
  #quiz-overlay{position:fixed;inset:0;background:rgba(28,35,33,0.55);display:none;align-items:center;justify-content:center;z-index:50;padding:1.5rem;}
  #quiz-card{background:var(--paper-raised);border-radius:14px;padding:1.75rem;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  #quiz-progress{font-size:12px;color:var(--muted);margin-bottom:0.75rem;}
  .quiz-prompt{font-family:'Fraunces',serif;font-size:18px;font-weight:500;margin:0 0 1rem;line-height:1.35;}
  .quiz-hint{font-size:12px;color:var(--muted);margin:-0.7rem 0 0.7rem;}
  .quiz-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;font-family:'Inter',sans-serif;font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:0.5rem;}
  .quiz-input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .quiz-choice{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.8rem;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);cursor:pointer;margin-bottom:0.5rem;}
  .quiz-choice:hover{background:rgba(28,35,33,0.05);}
  .quiz-choice.selected{background:var(--gold-pale);border-color:var(--gold-deep);font-weight:600;}
  .quiz-error{color:var(--red);font-size:12px;margin:-0.3rem 0 0.6rem;display:none;}
  #quiz-nav{display:flex;justify-content:space-between;margin-top:0.75rem;}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;flex:1;align-items:start;}
  @media (max-width:760px){.layout{grid-template-columns:1fr;}}
  .rail{display:flex;flex-direction:column;gap:1.25rem;position:sticky;top:1.5rem;}
  .card{background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.15rem;}
  .card h3{font-size:12px;color:var(--muted);margin:0 0 0.5rem;font-weight:500;letter-spacing:0.01em;}
  .scenario-topic{font-size:11px;color:var(--gold-deep);font-weight:600;margin:0 0 0.15rem;}
  .scenario-title{font-family:'Fraunces',serif;font-size:17px;font-weight:500;margin:0 0 0.4rem;line-height:1.3;}
  .scenario-body{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 0.75rem;}
  .persona-tag{display:inline-block;font-size:11.5px;color:var(--teal);background:var(--teal-pale);padding:0.2rem 0.55rem;border-radius:20px;margin-bottom:0.7rem;}
  .shuffle-btn{width:100%;background:transparent;border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.6rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;}
  .shuffle-btn:hover:not(:disabled){background:rgba(28,35,33,0.06);}
  .shuffle-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .toggle-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .toggle-btn{flex:1;background:transparent;border:none;padding:0.55rem 0.4rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .15s ease, color .15s ease;}
  .toggle-btn.active{background:var(--ink);color:var(--paper);}
  .toggle-btn:not(.active):hover{background:rgba(28,35,33,0.06);}
  .toggle-btn:disabled{cursor:not-allowed;opacity:0.6;}
  .diff-note{font-size:12px;color:var(--muted);margin-top:0.55rem;line-height:1.5;}
  .reset-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:0.55rem 0.7rem;font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;}
  .reset-btn:hover{background:rgba(28,35,33,0.06);}
  .history-item{display:flex;justify-content:space-between;align-items:baseline;padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-item .h-topic{color:var(--ink);}
  .history-item .h-meta{color:var(--muted);font-size:11px;}
  .history-grade{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--gold-deep);}
  .history-empty{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .main{background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:560px;overflow:hidden;}
  .chat-scroll{flex:1;overflow-y:auto;padding:1.5rem 1.5rem 0.5rem;display:flex;flex-direction:column;gap:0.9rem;max-height:560px;}
  .msg{max-width:min(72%, 560px);padding:0.65rem 0.9rem;border-radius:12px;font-size:14.5px;line-height:1.55;}
  .msg.employer{align-self:flex-start;background:var(--teal-pale);color:var(--ink);border-bottom-left-radius:3px;}
  .msg.user{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:3px;}
  .msg .role-label{display:block;font-size:11px;font-weight:500;margin-bottom:3px;opacity:0.65;}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:0.65rem 0.9rem;background:var(--teal-pale);border-radius:12px;border-bottom-left-radius:3px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--teal);opacity:0.5;animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.3;}40%{opacity:0.9;}}
  .composer{border-top:1px solid var(--border);padding:0.9rem 1.1rem 0.4rem;display:flex;gap:0.6rem;align-items:flex-end;}
  textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.75rem;font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;max-height:110px;background:var(--paper);color:var(--ink);}
  textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button.send{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0.6rem 1rem;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;}
  button.send:hover{background:#33403d;}
  button.send:disabled{opacity:0.45;cursor:not-allowed;}
  .word-counter{font-size:11.5px;color:var(--muted);padding:0.2rem 1.1rem 0.3rem;text-align:right;}
  .word-counter.warn{color:var(--red);}
  .footer-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 1.1rem 0.9rem;font-size:12.5px;color:var(--muted);}
  .end-btn{background:transparent;border:1px solid var(--gold-deep);color:var(--gold-deep);border-radius:8px;padding:0.45rem 0.8rem;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;cursor:pointer;}
  .end-btn:hover{background:rgba(201,162,39,0.1);}
  .end-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .feedback-view{padding:1.75rem 1.75rem 1.5rem;display:flex;flex-direction:column;gap:1.1rem;flex:1;overflow-y:auto;}
  .grade-header{display:flex;align-items:center;gap:1rem;}
  .grade-circle{width:56px;height:56px;border-radius:50%;background:var(--teal-pale);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--teal);flex-shrink:0;}
  .feedback-view h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0 0 0.2rem;}
  .feedback-view .sub{font-size:13px;color:var(--muted);margin:0;}
  .rubric{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .rubric-item{background:var(--paper);border-radius:8px;padding:0.6rem 0.75rem;}
  .rubric-item .r-label{font-size:11.5px;color:var(--muted);margin-bottom:0.3rem;}
  .rubric-meter{display:flex;gap:3px;}
  .rubric-meter span{flex:1;height:6px;border-radius:3px;background:var(--border);}
  .rubric-meter span.filled{background:var(--gold-deep);}
  .fb-block{border-left:3px solid var(--teal);padding:0.15rem 0 0.15rem 0.9rem;}
  .fb-block.warn{border-left-color:var(--red);}
  .fb-block.gold{border-left-color:var(--gold-deep);}
  .fb-block h4{font-size:12.5px;font-weight:600;margin:0 0 0.3rem;color:var(--ink);}
  .fb-block p{font-size:14px;line-height:1.6;margin:0;color:#3a423f;}
  .phrase-pair{display:flex;flex-direction:column;gap:0.5rem;margin-top:0.3rem;}
  .phrase{font-size:13.5px;padding:0.55rem 0.7rem;border-radius:8px;line-height:1.5;}
  .phrase.before{background:var(--red-pale);color:#5c1d26;}
  .phrase.after{background:var(--teal-pale);color:#173330;}
  .phrase b{font-weight:600;font-size:11px;display:block;margin-bottom:2px;opacity:0.75;}
  .again-btn{align-self:flex-start;margin-top:0.5rem;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0.6rem 1.1rem;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;}
  .again-btn:hover{background:#33403d;}
  .error-note{font-size:12.5px;color:var(--red);padding:0 1.1rem 0.6rem;}
  .save-note{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">Ground<span>work</span></div>
    <div class="tagline" id="tagline">Practice the conversation before it counts. Every session is scored so you can see yourself improve.</div>
  </header>

  <div class="section-switch" id="section-switch">
    <button class="section-btn active" data-section="practice">
      <span class="section-btn-label">Practice</span>
      <span class="section-btn-sub">Full sessions, graded</span>
    </button>
    <button class="section-btn" data-section="learn">
      <span class="section-btn-label">Learn</span>
      <span class="section-btn-sub">Quick skill lessons</span>
    </button>
  </div>

  <div id="practice-section">
  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab" data-mode="negotiation" disabled>Negotiation practice <span class="soon-badge">Coming soon!</span></button>
    <button class="mode-tab active" data-mode="interview">Interview practice</button>
  </div>

  <div class="layout">
    <div class="rail">
      <div class="card" id="quiz-prompt-card" style="display:none;"></div>

      <div class="card" id="situation-card">
        <h3>Situation</h3>
        <p class="scenario-topic" id="scenario-topic"></p>
        <p class="scenario-title" id="scenario-title"></p>
        <p class="scenario-body" id="scenario-body"></p>
        <p class="scenario-body" id="scenario-context" style="border-top:1px solid var(--border);padding-top:0.6rem;margin-top:0.4rem;"></p>
        <span class="persona-tag" id="persona-tag"></span>
        <button class="shuffle-btn" id="shuffle-btn">Find a new job</button>
      </div>

      <div class="card">
        <h3>Difficulty</h3>
        <div class="toggle-group" id="difficulty-toggle">
          <button class="toggle-btn active" id="diff-btn-0" data-idx="0"></button>
          <button class="toggle-btn" id="diff-btn-1" data-idx="1"></button>
        </div>
        <p class="diff-note" id="diff-note"></p>
      </div>

      <div class="card">
        <h3>Your history</h3>
        <div id="history-list">
          <p class="history-empty">Finish a session to see your grades here.</p>
        </div>
        <p style="font-size:11px;color:var(--muted);margin:0.6rem 0 0;line-height:1.5;">We save your grade, not your conversation.</p>
      </div>

      <button class="reset-btn" id="reset-btn">Restart this situation</button>
    </div>

    <div class="main" id="main-panel">
      <div class="chat-scroll" id="chat-scroll">
        <div class="msg employer">
          <span class="role-label" id="opening-label"></span>
          <span id="opening-text"></span>
        </div>
      </div>
      <div class="error-note" id="error-note" style="display:none;"></div>
      <div class="composer">
        <textarea id="user-input" rows="1" placeholder="Type your response..."></textarea>
        <button class="send" id="send-btn">Send</button>
      </div>
      <div class="word-counter" id="word-counter" style="display:none;"></div>
      <div class="footer-row">
        <span id="footer-hint">4 exchanges is usually enough to get useful feedback.</span>
        <button class="end-btn" id="end-btn">End & get graded</button>
      </div>
    </div>
  </div>
  </div>

  <div id="learn-section" style="display:none;">
    <div class="track-tabs" id="track-tabs">
      <button class="track-tab" data-track="negotiation" disabled>Negotiation <span class="soon-badge">Coming soon!</span></button>
      <button class="track-tab active" data-track="interview">Interview</button>
    </div>
    <div id="learn-path-view"></div>
    <div id="learn-lesson-view" style="display:none;">
      <button class="reset-btn" id="learn-back-btn" style="margin-bottom:1rem;">← Back to path</button>
      <div class="main" id="learn-main" style="max-width:600px;"></div>
    </div>
  </div>
</div>

<div id="quiz-overlay">
  <div id="quiz-card">
    <p id="quiz-progress"></p>
    <div id="quiz-body"></div>
    <p class="quiz-error" id="quiz-error"></p>
    <div id="quiz-nav">
      <button class="reset-btn" id="quiz-back-btn">Back</button>
      <button class="again-btn" id="quiz-next-btn">Next</button>
    </div>
  </div>
</div>

<script>
const NEGOTIATION_SCENARIOS = [
  { id:'salary', topic:'Salary offer', title:'The salary offer', roleLabel:'Hiring Manager', name:'Dana',
    body:"You've been offered a Warehouse Operations Coordinator role. {name}, the hiring manager, just named a number.",
    opening:"We'd love to have you on the team. We're offering $48,000 a year for the role, health coverage starts after 90 days. What do you think?",
    issue:"the starting salary and benefits for a new job offer" },
  { id:'raise', topic:'Asking for a raise', title:'The raise conversation', roleLabel:'Your manager', name:'Priya',
    body:"You've been in your role 18 months and requested this meeting to ask {name} for a raise.",
    opening:"You wanted to talk about your compensation — go ahead, I'm listening.",
    issue:"asking an existing manager for a raise, initiated by the candidate" },
  { id:'rent', topic:'Rent renewal', title:'The rent increase', roleLabel:'Landlord', name:'Marcus',
    body:"Your lease is up and {name}, your landlord, wants to raise the rent by $200 a month.",
    opening:"Your lease is up next month. Given the market, we're renewing at $1,850, up from $1,650. Let me know if that works.",
    issue:"a rent increase on lease renewal" },

// window.storage only exists inside Claude artifacts. This shim gives the
// same get/set/list interface backed by the browser's localStorage instead,
// so grade history, skill path progress, flag logs, and the quiz profile
// all work once this is deployed on its own. It's per-device, not
// per-account — swap in a real database (e.g. Supabase) for cross-device sync.
const storage = {
  async set(key, value){ localStorage.setItem(key, value); return { key, value }; },
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found');
    return { key, value: v };
  },
  async list(prefix){
    const keys = Object.keys(localStorage).filter(k => k.startsWith(prefix));
    return { keys };
  }
};

async function loadSkillProgress(){
  skillStars = { negotiation: {}, interview: {} };
  try{
    const result = await storage.list('skillpath:');
    if(result && result.keys){
      for(const k of result.keys){
        try{
          const r = await storage.get(k);
          if(r && r.value){
            const rec = JSON.parse(r.value);
            if(skillStars[rec.track]) skillStars[rec.track][rec.lessonId] = rec.stars;
          }
        } catch(e){}
      }
    }
  } catch(err){
    console.error('Could not load skill progress', err);
  }
}

async function saveSkillProgress(lessonId, stars, title){
  try{
    const existing = skillStars[currentTrack][lessonId];
    const best = existing === undefined ? stars : Math.max(existing, stars);
    skillStars[currentTrack][lessonId] = best;
    await storage.set('skillpath:' + currentTrack + ':' + lessonId, JSON.stringify({ track: currentTrack, lessonId, title, stars: best }));
  } catch(err){
    console.error('Could not save skill progress', err);
  }
}

function renderSkillPathVisual(){
  const container = el('learn-path-view');
  if(!container) return;
  const lessons = currentLessons();
  const trackStars = skillStars[currentTrack];
  const shape = TRACKS[currentTrack].pathShape;
  const unlocked = unlockedIndex();
  const nodeSize = 64;
  const gapY = 116;
  const amplitude = 80;
  const wrapWidth = Math.max(280, Math.min(460, (el('learn-section').clientWidth || 380) - 8));
  const centerX = wrapWidth / 2;
  const topPad = 46;
  const height = topPad + gapY * (lessons.length - 1) + nodeSize + 40;

  let nodesHTML = '';
  let extrasHTML = '';
  const points = [];
  let lastTier = null;

  lessons.forEach((lesson, idx) => {
    const y = topPad + idx * gapY;
    const x = centerX + amplitude * shape(idx);
    points.push(x + ',' + (y + nodeSize / 2));

    const stars = trackStars[lesson.id];
    const passed = stars !== undefined && stars >= 2;
    const locked = idx > unlocked;
    const isCurrent = idx === unlocked && !passed;

    if(lesson.tier !== lastTier){
      const side = x > centerX ? (x - 108) : (x + nodeSize + 14);
      extrasHTML += '<div class="path-tier-label" style="left:' + side + 'px;top:' + (y - 6) + 'px;">' + lesson.tier + '</div>';
      lastTier = lesson.tier;
    }

    let cls = 'path-node';
    let inner = String(idx + 1);
    if(locked){ cls += ' locked'; inner = '🔒'; }
    else if(passed){ cls += ' passed'; inner = '✓'; }
    else if(isCurrent){ cls += ' current'; }

    nodesHTML += '<div class="' + cls + '" data-idx="' + idx + '" style="left:' + (x - nodeSize / 2) + 'px;top:' + y + 'px;width:' + nodeSize + 'px;height:' + nodeSize + 'px;">' + inner + '</div>';

    if(isCurrent){
      extrasHTML += '<div class="path-bubble" style="left:' + (x - nodeSize / 2 - 6) + 'px;top:' + (y - 32) + 'px;">Start</div>';
    }
    if(passed){
      extrasHTML += '<div class="path-stars" style="left:' + (x - nodeSize / 2 + 4) + 'px;top:' + (y + nodeSize + 4) + 'px;">' + starsHTML(stars) + '</div>';
    }
    const titleSide = x > centerX ? (x - 120 - nodeSize / 2) : (x + nodeSize / 2 + 10);
    extrasHTML += '<div class="path-title" style="left:' + titleSide + 'px;top:' + (y + nodeSize / 2 - 8) + 'px;text-align:' + (x > centerX ? 'right' : 'left') + ';width:120px;">' + lesson.title + '</div>';

    if(openPopoverIdx === idx){
      const popW = 220;
      const popLeft = Math.max(6, Math.min(wrapWidth - popW - 6, x - popW / 2));
      const popTop = y + nodeSize + 8;
      const ratingHTML = stars !== undefined ? starsHTML(stars) : 'Not yet attempted';
      const body = locked
        ? '<p class="path-popover-locked">Complete earlier lessons to unlock this one.</p>'
        : '<p class="path-popover-rating">' + ratingHTML + '</p><button class="path-popover-start" data-idx="' + idx + '">' + (passed ? 'Review lesson' : 'Start lesson') + '</button>';
      extrasHTML += '<div class="path-popover" style="left:' + popLeft + 'px;top:' + popTop + 'px;width:' + popW + 'px;">' +
        '<p class="path-popover-title">' + lesson.title + '</p>' +
        '<p class="path-popover-desc">' + lesson.concept + '</p>' +
        body + '</div>';
    }
  });

  const lineD = points.length ? ('M' + points.join(' L')) : '';

  container.innerHTML = '<div style="position:relative;width:' + wrapWidth + 'px;height:' + height + 'px;margin:0 auto;">' +
    '<svg width="' + wrapWidth + '" height="' + height + '" style="position:absolute;top:0;left:0;">' +
    '<path d="' + lineD + '" fill="none" stroke="var(--border)" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round"/>' +
    '</svg>' + extrasHTML + nodesHTML + '</div>';
}

async function sendLearnMessage(){
  const input = el('learn-input');
  if(!input) return;
  const text = input.value.trim();
  const userTurns = learnMessages.filter(m => m.role === 'user').length;
  if(!text || learnBusy || userTurns >= 2) return;
  addLearnMessage('user', text);
  learnMessages.push({ role: 'user', content: text });
  input.value = '';
  setLearnBusy(true);
  showLearnTyping();
  try{
    const lesson = currentLessons()[learnLessonIndex];
    const reply = await callClaude(buildLearnSystemPrompt(lesson), learnMessages);
    hideLearnTyping();
    addLearnMessage('assistant', reply);
    learnMessages.push({ role: 'assistant', content: reply });
    const newUserTurns = learnMessages.filter(m => m.role === 'user').length;
    if(newUserTurns >= 2){
      await gradeCurrentAttempt();
    } else {
      setLearnBusy(false);
    }
  } catch(err){
    hideLearnTyping();
    console.error('sendLearnMessage failed:', err);
    showLearnError("The reply didn't come through. Try sending again.");
    setLearnBusy(false);
  }
}

async function gradeCurrentAttempt(){
  const lesson = currentLessons()[learnLessonIndex];
  const transcriptText = learnMessages.map(m => (m.role === 'user' ? 'You' : lesson.counterpart) + ': ' + m.content).join('\n');
  const gradingSystem = "You are grading a short skill-practice exchange for a lesson called '" + lesson.title + "'. The skill being tested: " + lesson.concept +
    " Grading criteria: " + lesson.criteria +
    " Return ONLY valid JSON, no markdown formatting, no code fences, no preamble, in exactly this shape: {\"stars\": number, \"feedback\": string}. stars is an integer 0-3, where 0 = not close, 1 = close but missing something, 2 = acceptable, 3 = excellent. feedback is 1-2 concise, plain-spoken sentences written directly to the user as \"you\".";
  try{
    const raw = await callClaude(gradingSystem, [{ role: 'user', content: "Transcript:\n\n" + transcriptText }]);
    const result = parseFeedbackJSON(raw);
    if(result.stars >= 2){
      await saveSkillProgress(lesson.id, result.stars, lesson.title);
      learnPhase = 'result';
      renderLearnMain(result);
    } else {
      learnFailCount += 1;
      if(learnFailCount >= 3){
        learnPhase = 'intro';
        learnFailCount = 0;
        learnHintLevel = 0;
        learnMessages = [];
        renderLearnMain();
      } else {
        learnPhase = 'fail';
        renderLearnMain(result);
      }
    }
  } catch(err){
    console.error('gradeCurrentAttempt failed:', err);
    showLearnError("Couldn't grade that attempt. Try sending again.");
  } finally {
    setLearnBusy(false);
  }
}

async function callClaude(systemPrompt, apiMessages){
  const response = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: systemPrompt, messages: apiMessages })
  });
  if(!response.ok){
    let detail = '';
    try{ const errBody = await response.json(); detail = (errBody && errBody.error && errBody.error.message) || JSON.stringify(errBody); } catch(e){}
    console.error('Claude API error:', response.status, detail);
    throw new Error("Request failed with status " + response.status + (detail ? (": " + detail) : ""));
  }
  const data = await response.json();
  const text = (data.content || []).map(b => b.text || "").join("").trim();
  if(!text) throw new Error("Empty response");
  return text;
}

}

function parseFeedbackJSON(raw){
  let cleaned = raw.trim();
  cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/,'').replace(/```\s*$/,'');
  try{
    return JSON.parse(cleaned);
  } catch(e){
    const start = cleaned.indexOf('{');
    const end = cleaned.lastIndexOf('}');
    if(start !== -1 && end !== -1 && end > start){
      return JSON.parse(cleaned.slice(start, end + 1));
    }
    throw e;
  }
}

function scoreToLetter(avg){
  if(avg >= 4.5) return 'A';
  if(avg >= 3.5) return 'B';
  if(avg >= 2.5) return 'C';
  if(avg >= 1.5) return 'D';
  return 'F';
}

function meterHTML(score){
  let out = '';
  for(let i=1;i<=5;i++) out += '<span class="' + (i <= score ? 'filled' : '') + '"></span>';
  return out;
}

async function saveAttempt(avg, grade){

      mode: config().label,
      topic: currentScenario.topic,
      persona: currentPersona.id,
      difficulty: difficultyCfg().label,
      grade: grade,
      avg: avg,
      date: new Date().toISOString()
    };

    await storage.set(key, JSON.stringify(record));
  } catch(err){
    console.error('Could not save attempt', err);
  }
}

async function loadHistory(){
  const listEl = el('history-list');
  if(!listEl) return;
  try{
    const result = await storage.list('attempts:');
    if(!result || !result.keys || result.keys.length === 0){
      listEl.innerHTML = '<p class="history-empty">Finish a session to see your grades here.</p>';
      return;
    }
    const keys = result.keys.slice().sort().reverse().slice(0, 6);
    const records = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) records.push(JSON.parse(r.value));
      } catch(e){}
    }
    if(records.length === 0){
      listEl.innerHTML = '<p class="history-empty">Finish a session to see your grades here.</p>';
      return;
    }
    listEl.innerHTML = records.map(r => {
      const d = new Date(r.date);
      const dateStr = (d.getMonth()+1) + '/' + d.getDate();
      return '<div class="history-item"><div><div class="h-topic">' + r.topic + '</div><div class="h-meta">' + r.mode + ' · ' + dateStr + '</div></div><div class="history-grade">' + r.grade + '</div></div>';
    }).join('');
  } catch(err){
    listEl.innerHTML = '<p class="history-empty">History isn\'t available right now.</p>';
  }
}

  const cfg = config();
  const keys = cfg.rubric.map(r => r.key);

  mainPanel.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'feedback-view';
  const rubricHTML = cfg.rubric.map(r =>
    '<div class="rubric-item"><div class="r-label">' + r.label + '</div><div class="rubric-meter">' + meterHTML(fb.scores[r.key] || 0) + '</div></div>'
  ).join('');
  view.innerHTML = `
    <div class="grade-header">
      <div class="grade-circle">${grade}</div>
      <div>
        <h2>Session graded</h2>
        <p class="sub">${currentScenario.topic} · ${difficultyCfg().label}</p>

let quizStep = 0;
let quizAnswers = {};
let quizBusy = false;
let customInterviewScenario = null;
let savedQuizAnswers = null;

function openQuiz(){
  quizStep = 0;
  quizAnswers = {};
  el('quiz-overlay').style.display = 'flex';
  el('quiz-back-btn').style.visibility = '';
  el('quiz-next-btn').disabled = false;
  renderQuizStep();
}
function closeQuiz(){
  el('quiz-overlay').style.display = 'none';
}

function renderQuizStep(){
  const q = INTERVIEW_QUIZ_QUESTIONS[quizStep];
  el('quiz-progress').textContent = 'Question ' + (quizStep + 1) + ' of ' + INTERVIEW_QUIZ_QUESTIONS.length;
  el('quiz-error').style.display = 'none';
  let bodyHTML = '<p class="quiz-prompt">' + q.prompt + '</p>';
  if(q.type === 'text'){
    const val = (quizAnswers[q.id] || '').replace(/"/g, '&quot;');
    bodyHTML += '<input type="text" class="quiz-input" id="quiz-text-input" placeholder="' + (q.placeholder || '') + '" value="' + val + '">';
    if(q.optional) bodyHTML += '<p class="quiz-hint">Optional — leave blank to skip.</p>';
  } else {
    bodyHTML += q.options.map(opt =>
      '<button class="quiz-choice' + (quizAnswers[q.id] === opt ? ' selected' : '') + '" data-value="' + opt + '">' + opt + '</button>'
    ).join('');
  }
  el('quiz-body').innerHTML = bodyHTML;
  el('quiz-back-btn').style.visibility = quizStep === 0 ? 'hidden' : 'visible';
  const isLast = quizStep === INTERVIEW_QUIZ_QUESTIONS.length - 1;
  el('quiz-next-btn').textContent = isLast ? 'Generate my scenario' : 'Next';
  if(q.type === 'text'){
    const input = el('quiz-text-input');
    input.focus();
    input.addEventListener('input', () => { quizAnswers[q.id] = input.value; });
  }
}

el('quiz-body').addEventListener('click', (e) => {
  const choice = e.target.closest('.quiz-choice');
  if(!choice) return;
  const q = INTERVIEW_QUIZ_QUESTIONS[quizStep];
  quizAnswers[q.id] = choice.dataset.value;
  document.querySelectorAll('.quiz-choice').forEach(b => b.classList.toggle('selected', b === choice));
});

el('quiz-back-btn').addEventListener('click', () => {
  if(quizStep === 0 || quizBusy) return;
  quizStep -= 1;
  renderQuizStep();
});

el('quiz-next-btn').addEventListener('click', async () => {
  if(quizBusy) return;
  const q = INTERVIEW_QUIZ_QUESTIONS[quizStep];
  if(q.type === 'text'){
    const input = el('quiz-text-input');
    if(input) quizAnswers[q.id] = input.value.trim();
  }
  if(!q.optional && !quizAnswers[q.id]){
    el('quiz-error').textContent = 'Please answer this one, or note "not sure" if that fits.';
    el('quiz-error').style.display = 'block';
    return;
  }
  const isLast = quizStep === INTERVIEW_QUIZ_QUESTIONS.length - 1;
  if(!isLast){
    quizStep += 1;
    renderQuizStep();
  } else {
    await generateCustomScenario();
  }
});

async function buildScenarioFromAnswers(a, avoidScenario){
  const genSystem = "You design realistic job-interview practice scenarios. The candidate has not necessarily named a specific job — instead, infer a plausible, specific role, industry, and company that genuinely fits their interests, strengths, and preferences. If they did give a specific job or company under 'specific target', honor that instead of inferring. Return ONLY valid JSON, no markdown formatting, no code fences, no preamble, in exactly this shape: {\"topic\": string, \"title\": string, \"org\": string, \"body\": string, \"openingDetail\": string, \"issue\": string, \"context\": string}. topic is a short label like 'Veterinary Assistant interview'. title is a short role name like 'Veterinary Assistant'. org is a specific, plausible company or organization name fitting the inferred field and their preferred environment. body is one sentence in second person describing the situation, e.g. \"You're interviewing for a Veterinary Assistant role at a small clinic called Maple Creek Animal Hospital.\" openingDetail is 1-2 sentences continuing an interviewer's greeting, personalized using the candidate's name if given, ending by inviting them to start with a general opening question. issue is a short phrase like 'a job interview for a Veterinary Assistant role at a small clinic, evaluating first impression, conciseness, and specific examples'. context is the most important field. Write it the way you'd explain the job to a friend who has never heard of it — 3-5 short, simple sentences, plain everyday words, no business jargon. Use concrete \"you'd do X\" statements instead of vague phrases like \"supports the team's efforts.\" Start with what the job actually involves day to day. Then add one or two sentences about the organization, and ideally a brief, natural nod to why this role fits someone with the candidate's stated interests. Avoid words like \"leverage,\" \"core responsibilities,\" or \"dynamic\" — write it simply enough that someone with no work experience at all could understand exactly what the job is.";
  let userMsg = "What kind of work appeals to them: " + (a.workType || 'not specified') +
    "\nThings they're genuinely interested in: " + (a.interests || 'not specified') +
    "\nEnvironment they picture themselves in: " + (a.environment || 'not specified') +
    "\nWhat matters most to them in a job: " + (a.values || 'not specified') +
    "\nSomething they're good at or proud of: " + (a.strength || 'not specified') +
    "\nCurrent status: " + (a.status || 'not specified') +
    "\nPurpose of this practice: " + (a.stakes || 'not specified') +
    "\nSpecific job or company in mind (use this if given, otherwise infer): " + (a.specificTarget || 'none given — infer a fitting role') +
    "\nWhat they're nervous about: " + (a.worry || 'not specified') +
    "\nPreferred name: " + (a.name || 'not specified');
  if(avoidScenario){
    userMsg += "\n\nPick a genuinely different role and company than last time — avoid repeating: " + avoidScenario.title + " at " + avoidScenario.org + ".";
  }

  const raw = await callClaude(genSystem, [{ role: 'user', content: userMsg }]);
  const generated = parseFeedbackJSON(raw);
  return {
    id: 'custom',
    topic: generated.topic,
    title: generated.title,
    org: generated.org,
    roleLabel: 'Interviewer',
    body: generated.body,
    opening: "Thanks for coming in today — I'm {name}, and I'll be interviewing you for the {title} role at {org}. " + generated.openingDetail,
    issue: generated.issue,
    context: generated.context
  };
}

async function generateCustomScenario(){
  quizBusy = true;
  el('quiz-next-btn').disabled = true;
  el('quiz-back-btn').style.visibility = 'hidden';
  el('quiz-progress').textContent = '';
  el('quiz-body').innerHTML = '<p class="quiz-prompt">Building your scenario…</p><p style="color:var(--muted);font-size:13px;">This takes a few seconds.</p>';

  const a = quizAnswers;
  try{
    const scenario = await buildScenarioFromAnswers(a);
    await storage.set('interviewQuiz:scenario', JSON.stringify(scenario));
    await storage.set('interviewQuiz:answers', JSON.stringify(a));
    customInterviewScenario = scenario;
    savedQuizAnswers = a;
    if(currentModeKey === 'interview'){
      currentScenario = scenario;
      freshMainPanel();
      renderSituation();
    }
    closeQuiz();
    renderQuizPromptCard();
  } catch(err){
    console.error('generateCustomScenario failed:', err);
    el('quiz-body').innerHTML = '<p class="quiz-prompt">Something went wrong generating your scenario.</p><p style="color:var(--red);font-size:13px;">Check your connection and try again.</p>';
    el('quiz-next-btn').textContent = 'Try again';
    el('quiz-next-btn').disabled = false;
    quizBusy = false;
    return;
  }
  quizBusy = false;
  el('quiz-next-btn').disabled = false;
}

async function regenerateInterviewScenario(){
  if(busy || messages.length > 0) return;
  if(!savedQuizAnswers){
    openQuiz();
    return;
  }
  const btn = el('shuffle-btn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Finding…';
  clearError();
  try{
    const scenario = await buildScenarioFromAnswers(savedQuizAnswers, currentScenario);
    await storage.set('interviewQuiz:scenario', JSON.stringify(scenario));
    customInterviewScenario = scenario;
    currentScenario = scenario;
    freshMainPanel();
    renderSituation();
  } catch(err){
    console.error('regenerateInterviewScenario failed:', err);
    showError("Couldn't find a new scenario. Check your connection and try again.");
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function loadQuizProfile(){
  try{
    const r = await storage.get('interviewQuiz:scenario');
    if(r && r.value) customInterviewScenario = JSON.parse(r.value);
  } catch(err){
    // no saved profile yet
  }
  try{
    const r2 = await storage.get('interviewQuiz:answers');
    if(r2 && r2.value) savedQuizAnswers = JSON.parse(r2.value);
  } catch(err){
    // no saved answers yet
  }
}

function renderQuizPromptCard(){
  const card = el('quiz-prompt-card');
  if(!card) return;
  if(currentModeKey !== 'interview'){ card.style.display = 'none'; return; }
  card.style.display = '';
  if(customInterviewScenario){
    card.innerHTML = '<h3>Your interview</h3>' +
      '<p class="scenario-title" style="font-size:14px;">' + customInterviewScenario.title + '</p>' +
      '<p class="scenario-body" style="margin-bottom:0.6rem;">' + customInterviewScenario.org + '</p>' +
      '<button class="shuffle-btn" id="use-my-scenario-btn" style="margin-bottom:0.5rem;">Use my scenario</button>' +
      '<button class="reset-btn" id="retake-quiz-btn">Retake quiz</button>';
  } else {
    card.innerHTML = '<h3>Personalize your practice</h3>' +
      '<p class="scenario-body" style="margin-bottom:0.6rem;">Answer 10 quick questions and we\'ll build an interview scenario for your actual target job.</p>' +
      '<button class="shuffle-btn" id="retake-quiz-btn">Take the quiz</button>';
  }
}
el('quiz-prompt-card').addEventListener('click', (e) => {
  if(e.target.id === 'retake-quiz-btn') openQuiz();
  if(e.target.id === 'use-my-scenario-btn' && customInterviewScenario && messages.length === 0){
    currentScenario = customInterviewScenario;
    freshMainPanel();
    renderSituation();
  }
});


if(new URLSearchParams(location.search).get('admin') === '1'){
  renderAdminView();
} else {
  loadQuizProfile().then(() => {
    if(customInterviewScenario && currentModeKey === 'interview'){
      currentScenario = customInterviewScenario;
    }
    renderSituation();
    setBusy(false);
    loadHistory();
    loadSkillProgress();
    if(!customInterviewScenario) openQuiz();
  });
}
</script>
